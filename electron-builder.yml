appId: com.easyscribe.app
productName: EasyScribe
directories:
  output: out
  buildResources: resources
files:
- dist/**/*
- dist-electron/**/*
- package.json
- python/**/*
- resources/**/*
extraResources:
  - from: python/
    to: python/
  - from: resources/
    to: resources/
win:
  target:
    - nsis
    - portable
  icon: resources/icons/icon.ico
mac:
  target:
    - dmg
    - zip
  icon: resources/icons/icon.icns
  category: public.app-category.productivity
linux:
  target:
    - AppImage
    - deb
    - rpm
  icon: resources/icons/icon.png
  category: AudioVideo
